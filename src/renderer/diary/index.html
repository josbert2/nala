<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nala Dev Diary</title>
  <link rel="stylesheet" href="diary.css">
</head>
<body data-theme="light">
  <div class="titlebar">
    <span>NALA DEV DIARY</span>
    <button class="titlebar-close" id="closeBtn" title="Cerrar">×</button>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">🐾 NALA</div>
      <nav>
        <div class="nav-item active" data-view="diario">DIARIO</div>
        <div class="nav-item" data-view="tablero">TABLERO</div>
        <div class="nav-item" data-view="reportes">REPORTES</div>
        <div class="nav-item" data-view="sprites">SPRITES</div>
        <div class="nav-item disabled">LOGROS</div>
        <div class="nav-item disabled">AMIGOS</div>
      </nav>
      <div class="sidebar-bottom">
        <button class="theme-toggle" id="themeToggle">☀/☾</button>
      </div>
    </aside>

    <main>
      <div class="conn-error hidden" id="connError">No se pudo conectar al server del diario.</div>
      <div class="stats" id="stats"></div>

      <section id="viewDiario">
        <div class="section-label">ACTIVIDAD</div>
        <div class="heatmap-months" id="heatmapMonths"></div>
        <div class="heatmap" id="heatmap"></div>

        <div class="day-nav">
          <button id="prevDay" title="Dia anterior">‹</button>
          <span id="dayLabel"></span>
          <button id="nextDay" title="Dia siguiente">›</button>
          <button id="todayBtn" class="today-btn hidden">HOY</button>
          <select id="projectFilter"><option value="">Todos los proyectos</option></select>
        </div>

        <form class="note-form" id="noteForm">
          <input type="text" id="noteInput" placeholder="+ nota..." maxlength="140">
          <button type="submit">+</button>
        </form>

        <div id="entries"></div>
      </section>

      <section id="viewTablero" class="hidden">
        <div class="board-cols">
          <div class="board-col" data-columna="todo">
            <div class="section-label">POR HACER</div>
            <div class="cards" data-columna="todo"></div>
            <form class="card-form" data-columna="todo">
              <input type="text" placeholder="+ tarjeta..." maxlength="140">
            </form>
          </div>
          <div class="board-col" data-columna="doing">
            <div class="section-label">HACIENDO</div>
            <div class="cards" data-columna="doing"></div>
            <form class="card-form" data-columna="doing">
              <input type="text" placeholder="+ tarjeta..." maxlength="140">
            </form>
          </div>
          <div class="board-col" data-columna="done">
            <div class="section-label">HECHO</div>
            <div class="cards" data-columna="done"></div>
            <form class="card-form" data-columna="done">
              <input type="text" placeholder="+ tarjeta..." maxlength="140">
            </form>
          </div>
        </div>
      </section>

      <section id="viewReportes" class="hidden">
        <div class="section-label">RESUMEN SEMANAL</div>
        <div class="summary-box" id="weeklySummary"></div>
        <div class="section-label">COMMITS POR PROYECTO</div>
        <div id="byProject"></div>
        <div class="section-label">POR DÍA (7 DÍAS)</div>
        <div class="day-bars" id="byDay"></div>
        <div class="section-label">HORARIOS MÁS ACTIVOS</div>
        <div id="byHour"></div>
      </section>

      <section id="viewSprites" class="hidden">
        <div class="section-label">ANIMACIONES CON ARTE REAL (V4)</div>
        <div class="sprite-path" id="spritePath"></div>
        <div class="empty" id="spriteStatus">Cargando…</div>
        <div class="sprite-grid" id="spriteGrid"></div>
      </section>
    </main>
  </div>

  <img class="mascot" src="img/mascot.png" alt="">

  <script src="diary.js"></script>
</body>
</html>
